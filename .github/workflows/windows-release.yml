name: Windows 설치 패키지

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows 설치 프로그램 패키징
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: 소스 체크아웃
        uses: actions/checkout@v4

      - name: Node.js 설치
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 의존성 설치
        run: npm ci

      - name: Windows용 Electron 런타임 준비
        shell: pwsh
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path 'node_modules/electron/dist/electron.exe')) {
            throw 'Windows용 Electron 런타임을 다운로드하지 못했습니다.'
          }

      - name: 오프라인 FFmpeg 코어 다운로드
        run: node scripts/download-ffmpeg-core.cjs --source=jsdelivr

      - name: Windows 설치 패키지 빌드
        run: npm run electron:build

      - name: 설치 패키지 찾기
        id: installers
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path release -Recurse -Filter *Setup*.exe
          if (-not $files) { throw 'Windows 설치 패키지가 생성되지 않았습니다.' }
          $files | ForEach-Object { Write-Host "설치 패키지 $($_.FullName)" }

      - name: Actions 빌드 산출물 저장
        uses: actions/upload-artifact@v4
        with:
          name: AI-Short-Drama-Studio-Windows-${{ github.ref_name }}
          path: release/**/*Setup*.exe
          if-no-files-found: error
          retention-days: 30

      - name: GitHub Releases에 게시
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $files = @(Get-ChildItem -Path release -Recurse -Filter *Setup*.exe | ForEach-Object { $_.FullName })
          $version = $tag -replace '^v', ''
          $changelog = Get-Content CHANGELOG.md -Raw -Encoding UTF8
          $pattern = '(?ms)^##\s+' + [regex]::Escape($version) + '[^\r\n]*\r?\n(.*?)(?=^##\s|\z)'
          $match = [regex]::Match($changelog, $pattern)
          if (-not $match.Success) { throw "변경 기록에 버전 $version 항목이 없어요." }
          $notes = $match.Groups[1].Value.Trim()
          gh release create $tag @files `
            --repo '${{ github.repository }}' `
            --title "Drama Flow Studio $tag" `
            --notes "$notes"
          if ($LASTEXITCODE -ne 0) { throw 'GitHub 릴리스를 게시하지 못했어요.' }
